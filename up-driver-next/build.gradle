plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rodriguesacai.updriver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rodriguesacai.updriver.independente'
        minSdk 26
        targetSdk 35
        versionCode 101
        versionName '1.0.1-beta'
        buildConfigField 'String', 'UP_DRIVER_ENDPOINT', '"https://gkwmqwtktedarodvqqtn.supabase.co/functions/v1/driver-api-independent"'
        buildConfigField 'String', 'UP_REGISTRATION_ENDPOINT', '"https://gkwmqwtktedarodvqqtn.supabase.co/functions/v1/driver-registration-independent"'
        buildConfigField 'String', 'UP_PUBLISHABLE_KEY', '"sb_publishable_-G8dzZ51cG9ZTdVviPAQdQ_9oSnwCyG"'
        // A preview can log into the shared Firebase Auth project, but must NOT
        // pretend to have its own registered Android app or working FCM.
        def previewAppId = '1:1010835711502:android:979e8dadff59ad17d6be5f'
        def suppliedAppId = (project.findProperty('upFirebaseAppId') ?: '').toString().trim()
        if (suppliedAppId && !(suppliedAppId ==~ /1:1010835711502:android:[A-Fa-f0-9]{16,}/)
                || suppliedAppId == previewAppId) {
            throw new GradleException('UP Firebase App ID: informe o ID NOVO do pacote Android independente, nunca o do app antigo.')
        }
        def firebaseAppId = suppliedAppId ?: previewAppId
        def suppliedApiKey = (project.findProperty('upFirebaseApiKey') ?: '').toString().trim()
        def firebaseApiKey = suppliedApiKey ?: 'AIzaSyBkCcdbR8Z9V9DB0wAJfC_YiRaNe8nnaA4'
        buildConfigField 'String', 'UP_FIREBASE_API_KEY', '"' + firebaseApiKey + '"'
        buildConfigField 'String', 'UP_FIREBASE_APP_ID', '"' + firebaseAppId + '"'
        buildConfigField 'boolean', 'UP_FIREBASE_ANDROID_REGISTERED', (!suppliedAppId.isEmpty()).toString()
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
