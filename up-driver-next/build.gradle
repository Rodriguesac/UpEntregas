plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rodriguesacai.updriver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rodriguesacai.updriver.independente'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0.0-beta'
        buildConfigField 'String', 'UP_DRIVER_ENDPOINT', '"https://gkwmqwtktedarodvqqtn.supabase.co/functions/v1/driver-api-independent"'
        buildConfigField 'String', 'UP_REGISTRATION_ENDPOINT', '"https://gkwmqwtktedarodvqqtn.supabase.co/functions/v1/driver-registration-independent"'
        buildConfigField 'String', 'UP_PUBLISHABLE_KEY', '"sb_publishable_-G8dzZ51cG9ZTdVviPAQdQ_9oSnwCyG"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
