<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UP Gestor</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;background:#f8fafc}*{box-sizing:border-box}body{margin:0;background:#f8fafc}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginBox{width:100%;max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:22px;padding:24px;box-shadow:0 18px 45px #0f172a12}.brand{width:64px;height:64px;border-radius:20px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;margin:0 auto 16px}.login h1{text-align:center;margin:0;font-size:30px}.login p{text-align:center;color:#64748b;margin:7px 0 26px}.pin{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font-size:24px;text-align:center;letter-spacing:9px;outline:none}.primary{border:0;background:#111827;color:#fff;border-radius:13px;padding:14px 16px;font-weight:800;width:100%;margin-top:14px}.error{color:#b91c1c;text-align:center;min-height:20px;margin-top:10px;font-size:13px}.app{display:none;min-height:100vh}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 14px}.topline{display:flex;align-items:center;gap:12px}.title{font-size:22px;font-weight:900;flex:1}.live{font-size:12px;color:#64748b}.refresh{border:1px solid #cbd5e1;background:#fff;border-radius:11px;padding:9px 12px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.nav button{border:0;border-radius:11px;padding:10px 4px;background:transparent;color:#475569;font-weight:800}.nav button.on{background:#111827;color:#fff}.wrap{padding:14px 14px 28px;max-width:760px;margin:auto}.section{font-weight:900;font-size:20px;margin:3px 0 12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric,.card{background:#fff;border:1px solid #e2e8f0;border-radius:17px}.metric{padding:15px}.metric small{color:#64748b;font-weight:700}.metric b{display:block;font-size:30px;margin:3px 0}.metric span{color:#64748b;font-size:12px}.subhead{font-size:18px;font-weight:900;margin:22px 0 10px}.card{padding:15px;margin-bottom:10px}.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.code{font-weight:900;font-size:17px}.pill{font-size:11px;font-weight:900;color:#fff;border-radius:999px;padding:5px 9px}.muted{color:#64748b;font-size:13px}.name{font-weight:800;margin-top:9px}.money{margin-top:3px;color:#475569;font-size:14px}.driver{margin-top:8px;font-size:14px;font-weight:700}.waiting{color:#b45309}.assigned{color:#166534}.alert{margin-top:9px;background:#fee2e2;color:#991b1b;border-radius:10px;padding:9px;font-size:13px;font-weight:800}.address{margin-top:8px;color:#475569;font-size:13px}.actions{display:flex;gap:8px;margin-top:12px}.actions button,.map{border-radius:11px;padding:11px 12px;font-weight:900;border:1px solid #cbd5e1;background:#fff;color:#111827;flex:1}.actions .send{background:#111827;color:#fff;border-color:#111827}.empty{text-align:center;color:#64748b;padding:30px 12px}.online{color:#16a34a}.offline{color:#64748b}.spinner{height:3px;background:#e2e8f0;overflow:hidden;display:none}.spinner:after{content:"";display:block;width:38%;height:100%;background:#111827;animation:run 1s linear infinite}@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(300%)}}@media(min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="loginBox"><div class="brand">UP</div><h1>UP Gestor</h1><p>Controle operacional do UP Entregas</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••••"><button class="primary" onclick="login()">ENTRAR NO GESTOR</button><div id="err" class="error"></div></div></div>
<div id="app" class="app"><div class="top"><div class="topline"><div class="grow"><div class="title">UP Gestor</div><div id="live" class="live">Conectando…</div></div><button class="refresh" onclick="load(true)">Atualizar</button></div><div class="nav"><button id="n-panel" class="on" onclick="tab('panel')">Painel</button><button id="n-orders" onclick="tab('orders')">Pedidos</button><button id="n-couriers" onclick="tab('couriers')">Entregadores</button></div></div><div id="spin" class="spinner"></div><main id="main" class="wrap"></main></div>
<script>
const API='https://jgjmntezfjuyuxhcnvhd.supabase.co/functions/v1/gestor-orders';let PIN='',ORD=[],COU=[],TAB='panel',busy=false;const terminal=s=>['ENTREGUE','CONCLUIDO','CONCLUÍDO','FINALIZADO','RETIRADO','CANCELADO','CANCELADA'].includes((s||'').toUpperCase());
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-gestor-pin':PIN},body:JSON.stringify({action,...extra})});let j={};try{j=await r.json()}catch(e){}if(r.status===401)throw Error('PIN incorreto.');if(!r.ok||!j.ok)throw Error(j.error||'Falha na operação');return j}
async function login(){const p=document.querySelector('#pin').value.trim();if(!/^\d{6}$/.test(p)){err('Digite o PIN de 6 dígitos.');return}PIN=p;err('');try{await api('ping');document.querySelector('#login').style.display='none';document.querySelector('#app').style.display='block';await load(true);setInterval(()=>load(false),10000)}catch(e){PIN='';err(e.message)}}function err(x){document.querySelector('#err').textContent=x}
async function load(show){if(busy||!PIN)return;busy=true;if(show)document.querySelector('#spin').style.display='block';document.querySelector('#live').textContent='Atualizando operação…';try{const [a,b]=await Promise.all([api('list'),api('couriers_list')]);ORD=a.orders||[];COU=b.couriers||[];document.querySelector('#live').textContent='Ao vivo • atualizado agora';render()}catch(e){document.querySelector('#live').textContent='Falha de conexão';toast(e.message)}finally{busy=false;document.querySelector('#spin').style.display='none'}}
function tab(t){TAB=t;['panel','orders','couriers'].forEach(x=>document.querySelector('#n-'+x).classList.toggle('on',x===t));render()}function delivery(o){const f=(o.fulfillment_type||'').toUpperCase();return !f||f==='ENTREGA'||f==='DELIVERY'}
function render(){const m=document.querySelector('#main');if(TAB==='orders')m.innerHTML=ordersView();else if(TAB==='couriers')m.innerHTML=couriersView();else m.innerHTML=panelView()}
function panelView(){const active=ORD.filter(o=>delivery(o)&&!terminal(o.status)),wait=active.filter(o=>!o.courier_id),route=active.filter(o=>o.courier_id),online=COU.filter(c=>c.online);return `<div class="section">Operação agora</div><div class="metrics">${metric('Ativas',active.length,'corridas')}${metric('Sem entregador',wait.length,'na fila')}${metric('Em rota',route.length,'atribuídas')}${metric('Online',online.length,'entregadores')}</div><div class="subhead">Corridas ativas</div>${active.slice(0,6).map(o=>orderCard(o,true)).join('')||empty('Nenhuma corrida ativa agora.')}`}
function ordersView(){const x=ORD.filter(delivery);return `<div class="section">Pedidos e corridas</div>${x.map(o=>orderCard(o,false)).join('')||empty('Nenhum pedido de entrega encontrado.')}`}
function couriersView(){return `<div class="section">Entregadores</div>${COU.map(c=>courierCard(c)).join('')||empty('Nenhum entregador cadastrado.')}`}
function metric(a,b,c){return `<div class="metric"><small>${esc(a)}</small><b>${b}</b><span>${esc(c)}</span></div>`}function empty(x){return `<div class="card empty">${esc(x)}</div>`}
function orderCard(o,compact){const c=o.customer||{},d=o.courier||{},assigned=!!o.courier_id,raw=o.raw_payload||{},code=o.order_code||String(o.id||'').slice(0,6).toUpperCase(),address=addr(o.delivery_address||{}),lat=Number(d.current_lat||0),lng=Number(d.current_lng||0),canMap=valid(lat,lng);let act='';if(!assigned&&!terminal(o.status))act+=`<button class="send" onclick="sendUp('${escAttr(o.id)}',this)">ENVIAR AO UP</button>`;if(assigned&&canMap)act+=`<button onclick="map(${lat},${lng})">MAPA</button>`;return `<div class="card"><div class="row"><div class="code grow">#${esc(code)}</div><span class="pill" style="background:${statusColor(o.status)}">${esc(statusLabel(o.status))}</span></div><div class="name">${esc(c.name||'Cliente')}</div><div class="money">${brl(o.total)}${o.payment_method?' • '+esc(o.payment_method):''}</div><div class="driver ${assigned?'assigned':'waiting'}">${assigned?'Entregador: '+esc(d.name||'Entregador'):'Aguardando entregador'}</div>${raw.up_occurrence_active?`<div class="alert">OCORRÊNCIA • ${esc(raw.up_occurrence_reason||'Informada pelo entregador')}</div>`:''}${!compact&&address?`<div class="address">${esc(address)}</div>`:''}${act?`<div class="actions">${act}</div>`:''}</div>`}
function courierCard(c){const lat=Number(c.current_lat||0),lng=Number(c.current_lng||0),ok=valid(lat,lng);return `<div class="card"><div class="row"><div class="code grow">${esc(c.name||'Entregador')}</div><span class="pill" style="background:${c.online?'#16a34a':'#64748b'}">${c.online?'ONLINE':'OFFLINE'}</span></div><div class="money">Status: ${esc(courierStatus(c.status))}</div>${c.phone?`<div class="muted">${esc(c.phone)}</div>`:''}${c.last_location_at?`<div class="muted">Localização: ${esc(relative(c.last_location_at))}</div>`:''}${ok?`<div class="actions"><button onclick="map(${lat},${lng})">ABRIR NO MAPA</button></div>`:''}</div>`}
async function sendUp(id,btn){btn.disabled=true;btn.textContent='ENVIANDO…';try{await api('status',{orderId:id,status:'AGUARDANDO_ENTREGADOR'});toast('Pedido enviado para o UP Entregas.');await load(true)}catch(e){btn.disabled=false;btn.textContent='ENVIAR AO UP';toast(e.message)}}
function map(lat,lng){location.href=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`}function valid(a,b){return a&&b&&Math.abs(a)<=90&&Math.abs(b)<=180}function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function statusLabel(s){s=(s||'').toUpperCase();if(s.includes('AGUARDANDO_ENTREGADOR')||s.includes('BUSCANDO_ENTREGADOR'))return'Buscando entregador';if(s.includes('PREPAR'))return'Em preparo';if(s==='PRONTO')return'Pronto';if(s.includes('DESPACH')||s.includes('ENTREGA'))return'Em entrega';if(terminal(s))return s.startsWith('CANCEL')?'Cancelado':'Finalizado';if(['CONFIRMADO','ACEITO'].includes(s))return'Confirmado';return s?s.replaceAll('_',' '):'Sem status'}
function statusColor(s){s=(s||'').toUpperCase();if(s.startsWith('CANCEL'))return'#dc2626';if(terminal(s))return'#16a34a';if(s.includes('AGUARDANDO_ENTREGADOR')||s.includes('BUSCANDO_ENTREGADOR'))return'#d97706';if(s.includes('DESPACH')||s.includes('ENTREGA'))return'#2563eb';return'#475569'}
function courierStatus(s){return({available:'Disponível',pickup:'Indo/na loja',delivery:'Em entrega',at_customer:'No cliente',offline:'Offline'})[(s||'').toLowerCase()]||s||'Sem status'}
function addr(a){const rua=a.rua||a.street||a.logradouro||'',n=a.numero||a.number||'',b=a.bairro||a.district||a.neighborhood||'';return [rua+(n?(rua?', ':'')+n:''),b].filter(Boolean).join(' • ')}function relative(x){const d=(Date.now()-new Date(x).getTime())/1000;if(!isFinite(d)||d<0)return x;if(d<60)return'agora';if(d<3600)return`há ${Math.floor(d/60)} min`;if(d<86400)return`há ${Math.floor(d/3600)} h`;return`há ${Math.floor(d/86400)} d`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return String(s??'').replace(/'/g,'') }function toast(x){document.querySelector('#live').textContent=x;setTimeout(()=>{if(PIN)document.querySelector('#live').textContent='Ao vivo'},2500)}
</script></body></html>
