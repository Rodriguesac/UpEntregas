plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.rodriguesacai.entregador'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.rodriguesacai.entregador'
        minSdk 26
        targetSdk 35
        versionCode 280
        versionName '2.8.0-rastreamento-economico'

        // Endpoint público configurável em build. Nenhum segredo privado no APK.
        // Valores padrão preservam a conexão da versão já em produção.
        def upDriverApiUrl = project.findProperty('upDriverApiUrl') ?: 'https://fdqqwdplprzpqufpgdrm.supabase.co/functions/v1/driver-api'
        def upPublishableKey = project.findProperty('upPublishableKey') ?: 'sb_publishable_yV7nuzH5yz17PzGRVK3o5g_UNvt7b4d'
        buildConfigField 'String', 'UP_DRIVER_API_URL', '"' + upDriverApiUrl.toString() + '"'
        buildConfigField 'String', 'UP_PUBLISHABLE_KEY', '"' + upPublishableKey.toString() + '"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
