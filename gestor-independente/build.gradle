plugins { id 'com.android.application' }

android {
    namespace 'com.rodriguesacai.upgestor.independente'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rodriguesacai.upgestor.independente'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0.0-preview'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            // Bundle the independent manager dashboard as HTTPS app assets.
            // Keep the old Android manager and its embedded legacy HTML intact.
            assets.srcDirs = ['../web-gestor-independente']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
