name: Publicar UP Gestor no Firebase Hosting (site isolado)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-up-gestor-firebase.yml'
      - 'web-gestor-independente/**'
      - 'firebase.up-gestor.json'
      - 'scripts/test-up-manager-independent.mjs'
      - 'scripts/test-up-manager-operations-v3.mjs'
  workflow_dispatch:
    inputs:
      confirm_site:
        description: 'Para publicar, confirme digitando rodrigueslogistica'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-up-gestor-firebase
  cancel-in-progress: false
jobs:
  firebase_hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UP_FIREBASE_PROJECT: rodrigues-d6566
      UP_FIREBASE_SITE: rodrigueslogistica
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar aplicação antes da publicação
        shell: bash
        run: |
          set -euo pipefail
          node --check web-gestor-independente/app.js
          node --check web-gestor-independente/manual-address.js
          node scripts/test-up-manual-address.mjs
          node --check web-gestor-independente/map.js
          node --check web-gestor-independente/map-premium.js
          node --check web-gestor-independente/pricing-ui.js
          node --check web-gestor-independente/operations-ui.js
          node scripts/test-up-manager-independent.mjs
          node scripts/test-up-manager-operations-v3.mjs
      - name: Confirmar repositório, branch e destino Firebase
        env:
          CONFIRM_SITE: ${{ inputs.confirm_site }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "Rodriguesac/UpEntregas" ]; then
            echo "::error title=Repositório incorreto::Recusando publicação fora do projeto UP original."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Branch incorreta::Publicação automática somente a partir da main."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CONFIRM_SITE" != "$UP_FIREBASE_SITE" ]; then
              echo "::error title=Destino não confirmado::Digite rodrigueslogistica."
              exit 1
            fi
          else
            echo "::error title=Evento não autorizado::Publicação bloqueada."
            exit 1
          fi
          echo "Projeto e site exclusivos confirmados: $UP_FIREBASE_PROJECT / $UP_FIREBASE_SITE"
      - name: Preparar arquivos públicos de forma isolada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .up-gestor-hosting
          cp web-gestor-independente/index.html .up-gestor-hosting/
          cp web-gestor-independente/app.js .up-gestor-hosting/
          cp web-gestor-independente/manual-address.js .up-gestor-hosting/
          cp web-gestor-independente/map.js .up-gestor-hosting/
          cp web-gestor-independente/map-premium.js .up-gestor-hosting/
          npm install --prefix /tmp/up-maplibre --no-save --ignore-scripts --no-audit --no-fund --package-lock=false maplibre-gl@5.24.1
          cp /tmp/up-maplibre/node_modules/maplibre-gl/dist/maplibre-gl.js .up-gestor-hosting/
          cp /tmp/up-maplibre/node_modules/maplibre-gl/dist/maplibre-gl.css .up-gestor-hosting/
          cp web-gestor-independente/operations-ui.js .up-gestor-hosting/
          cp web-gestor-independente/pricing-ui.js .up-gestor-hosting/
          cp web-gestor-independente/styles.css .up-gestor-hosting/
          cp web-gestor-independente/config.js .up-gestor-hosting/
          python3 - <<'PY'
          from pathlib import Path
          import json
          config=Path('.up-gestor-hosting/config.js')
          text=config.read_text(encoding='utf-8')
          assert text.count('enabled:false')==1
          assert 'firebaseProjectId:"rodrigues-d6566"' in text
          assert 'projectRef:"gkwmqwtktedarodvqqtn"' in text
          active_lines='\n'.join(line for line in text.splitlines() if not line.lstrip().startswith('//'))
          assert 'service_role' not in active_lines.lower(), 'Chave privada não pode estar no JavaScript'
          config.write_text(text.replace('enabled:false','enabled:true',1),encoding='utf-8')
          firebase=json.loads(Path('firebase.up-gestor.json').read_text())
          assert firebase['hosting']['site']=='upgestor-rac', 'Configuração base inesperada'
          assert firebase['hosting']['public']=='.up-gestor-hosting'
          assert 'hosting' not in json.loads(Path('firebase.json').read_text())
          firebase['hosting']['site']='rodrigueslogistica'
          Path('.up-gestor-target.json').write_text(json.dumps(firebase,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Preparação de publicação isolada: rodrigueslogistica.web.app')
          PY
      - name: Validar autorização de deploy
        env:
          FIREBASE_DEPLOY_CREDENTIAL: ${{ secrets.UP_FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_DEPLOY_CREDENTIAL" ]; then
            echo "::error title=Conectar Firebase::Configure o segredo UP_FIREBASE_SERVICE_ACCOUNT_JSON no repositório ou conecte o app Firebase ao ChatGPT para publicação direta."
            exit 1
          fi
      - name: Autenticar no Firebase de forma segura
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.UP_FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools
      - name: Confirmar que o site já pertence ao projeto Firebase informado
        shell: bash
        run: |
          set -euo pipefail
          firebase hosting:sites:list --project "$UP_FIREBASE_PROJECT" --json > /tmp/up-firebase-sites.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/up-firebase-sites.json',encoding='utf-8'))
          assert data.get('status')=='success', 'Não foi possível ler os sites do projeto Firebase'
          target=os.environ['UP_FIREBASE_SITE']
          def site_records(value):
              if isinstance(value,list):
                  for entry in value:
                      yield from site_records(entry)
              elif isinstance(value,dict):
                  if isinstance(value.get('name'),str) and '/sites/' in value['name']:
                      yield value
                  elif isinstance(value.get('siteId'),str):
                      yield value
                  for nested in value.values():
                      if isinstance(nested,(dict,list)):
                          yield from site_records(nested)
          sites=list(site_records(data.get('result')))
          found=any(site.get('name','').endswith('/sites/'+target) or site.get('siteId')==target for site in sites)
          if not found:
              available=[site.get('siteId') or site.get('name','').rsplit('/',1)[-1] for site in sites]
              raise SystemExit('O site '+target+' não está na lista do projeto '+os.environ['UP_FIREBASE_PROJECT']+'. Sites: '+', '.join(available))
          print('O site de destino existe no projeto configurado; autorizado para etapa de publicação.')
          PY
      - name: Publicar APENAS site UP Gestor
        run: |
          firebase deploy --project "$UP_FIREBASE_PROJECT" \
            --config .up-gestor-target.json --only hosting --non-interactive
          echo "UP Gestor: https://${UP_FIREBASE_SITE}.web.app" >> "$GITHUB_STEP_SUMMARY"
