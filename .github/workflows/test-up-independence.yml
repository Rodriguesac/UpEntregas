name: Validar arquitetura UP independente
on:
  push:
    branches: [main]
    paths:
      - 'supabase/up-independent-schema.sql'
      - 'supabase/functions/up-order-bridge/**'
      - 'scripts/test-up-independence.mjs'
      - 'scripts/test-up-handoff-contract.mjs'
      - 'scripts/test-up-status-contract.mjs'
      - 'scripts/test-up-status-receiver.mjs'
      - 'scripts/test-up-relay-outbox.mjs'
      - 'scripts/test-up-outbox-schema.mjs'
      - 'bridge/**'
      - '.github/workflows/test-up-independence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar integração e isolamento sem acessar produção
        run: |
          node scripts/test-up-independence.mjs
          node scripts/test-up-handoff-contract.mjs
          node scripts/test-up-status-contract.mjs
          node scripts/test-up-status-receiver.mjs
          node scripts/test-up-relay-outbox.mjs
          node scripts/test-up-outbox-schema.mjs
