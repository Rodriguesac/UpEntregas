name: Validar arquitetura UP independente
on:
  push:
    branches: [main, exec/operational-reliability-20261110]
    paths:
      - 'supabase/up-independent-schema.sql'
      - 'supabase/up-driver-operations.sql'
      - 'supabase/up-manager-independent.sql'
      - 'supabase/up-offer-notifications.sql'
      - 'supabase/functions/up-manager-independent/**'
      - 'supabase/functions/up-offer-push/**'
      - 'supabase/functions/up-customer-tracking/**'
      - 'bridge/store-customer-ticket/**'
      - 'web-gestor-independente/**'
      - 'supabase/functions/up-order-bridge/**'
      - 'supabase/functions/up-status-relay/**'
      - 'supabase/functions/driver-api-independent/**'
      - 'supabase/functions/driver-registration-independent/**'
      - 'scripts/test-up-independence.mjs'
      - 'scripts/test-up-handoff-contract.mjs'
      - 'scripts/test-up-status-contract.mjs'
      - 'scripts/test-up-status-receiver.mjs'
      - 'scripts/test-up-relay-outbox.mjs'
      - 'scripts/test-up-outbox-schema.mjs'
      - 'scripts/verify-up-postgres.sh'
      - 'scripts/test-up-worker-safety.mjs'
      - 'scripts/test-up-status-relay.mjs'
      - 'scripts/test-up-independent-driver.mjs'
      - 'scripts/test-up-independent-registration.mjs'
      - 'scripts/test-up-manager-independent.mjs'
      - 'scripts/test-up-bridge-probe.mjs'
      - 'scripts/verify-up-manager-postgres.sh'
      - 'scripts/verify-up-driver-postgres.sh'
      - 'scripts/verify-up-e2e.sh'
      - 'scripts/verify-up-e2e.sql'
      - 'scripts/verify-up-gps-retention.sql'
      - 'supabase/up-gps-retention.sql'
      - 'bridge/**'
      - '.github/workflows/test-up-independence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar compilação das Edge Functions independentes (sem deploy)
        run: |
          deno check supabase/functions/driver-api-independent/index.ts
          deno check supabase/functions/driver-registration-independent/index.ts
          deno check supabase/functions/up-status-relay/index.ts
          deno check supabase/functions/up-order-bridge/index.ts
          deno check supabase/functions/up-manager-independent/index.ts
          deno check supabase/functions/up-offer-push/index.ts
          deno check supabase/functions/up-customer-tracking/index.ts
          deno check bridge/store-customer-ticket/index.ts
          deno check bridge/store-outbox-worker/index.ts
          node --check web-gestor-independente/app.js
      - name: Validar integração e isolamento sem acessar produção
        run: |
          node scripts/test-driver-api-runtime.mjs
          node scripts/test-up-independence.mjs
          node scripts/test-up-handoff-contract.mjs
          node scripts/test-up-status-contract.mjs
          node scripts/test-up-status-receiver.mjs
          node scripts/test-up-relay-outbox.mjs
          node scripts/test-up-outbox-schema.mjs
          node scripts/test-up-worker-safety.mjs
          node scripts/test-up-status-relay.mjs
          node scripts/test-up-independent-driver.mjs
          node scripts/test-up-independent-registration.mjs
          node scripts/test-up-manager-independent.mjs
          node scripts/test-up-bridge-probe.mjs
      - name: Validar SQL em PostgreSQL descartável
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          fi
          bash scripts/verify-up-postgres.sh
          bash scripts/verify-up-driver-postgres.sh
          bash scripts/verify-up-manager-postgres.sh
          bash scripts/verify-up-e2e.sh
      - name: Empacotar novo painel do UP (sem publicar)
        uses: actions/upload-artifact@v4
        with:
          name: UP-Gestor-Independente-Previa
          path: web-gestor-independente/
          if-no-files-found: error
