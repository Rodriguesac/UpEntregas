name: Integrar aprovação Gestor Web

on:
  push:
    paths:
      - '.github/workflows/integrate-manager-approval.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar integração
        run: python .github/scripts/integrate_manager_approval.py

      - name: Conferir alterações
        run: |
          grep -q 'registrationApi.submit' app/src/main/java/com/rodriguesacai/entregador/RegisterActivity.java
          grep -q 'registrationApi.syncStatus' app/src/main/java/com/rodriguesacai/entregador/LoginActivity.java
          grep -q 'class DriverRegistrationApi' app/src/main/java/com/rodriguesacai/entregador/DriverRegistrationApi.java

      - name: Salvar integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/rodriguesacai/entregador/RegisterActivity.java app/src/main/java/com/rodriguesacai/entregador/LoginActivity.java
          if git diff --cached --quiet; then
            echo 'Integração já aplicada.'
          else
            git commit -m 'Integra aprovação do Gestor Web ao app do entregador'
            git push origin main
          fi
