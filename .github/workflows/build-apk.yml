name: Gerar APK UP Entregas

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Mantém a MESMA assinatura de debug entre as compilações deste repositório.
      # A primeira V1.9 pode exigir uma última desinstalação da versão antiga.
      # Depois, enquanto esta chave persistir no cache, o Android aceita atualização por cima.
      - name: Restaurar chave de atualização
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: up-entregas-debug-keystore-estavel-v1

      - name: Garantir chave de atualização
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=UP Entregas, OU=Rodrigues Acai e Cia, O=Rodrigues, L=Campo Grande, ST=MS, C=BR"
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UP-Entregas.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: UP-Entregas-APK
          path: UP-Entregas.apk
          if-no-files-found: error
