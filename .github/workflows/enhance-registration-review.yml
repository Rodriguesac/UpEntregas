name: Verificar painel de cadastro UP
on:
  push:
    paths:
      - "web-gestor/index.html"
      - ".github/workflows/enhance-registration-review.yml"
  pull_request:
    paths:
      - "web-gestor/index.html"
      - ".github/workflows/enhance-registration-review.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir funções de análise de cadastro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("web-gestor/index.html").read_text(encoding="utf-8")
          checks=("function applicationsView(", "function applicationCard(", "function reviewApp(", "application_set")
          missing=[value for value in checks if value not in source]
          if missing:
              raise SystemExit("Funções de cadastro ausentes: "+", ".join(missing))
          print("Painel de cadastros presente. Verificação somente leitura; nenhum commit ou deploy automático.")
          PY
