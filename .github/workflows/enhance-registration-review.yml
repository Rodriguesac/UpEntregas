name: Inspecionar cadastro legado (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir base do gestor existente
        shell: bash
        run: |
          set -euo pipefail
          test -s web-gestor/index.html
          echo "Gestor legado preservado. Modificações devem ser revisadas em PR."
