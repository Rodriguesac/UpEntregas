<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UP Gestor</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#111827;background:#f4f7fb;--ink:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--card:#fff}*{box-sizing:border-box}body{margin:0;background:#f4f7fb}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginCard{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(16,24,40,.08)}.logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(135deg,#0f172a,#2563eb);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;margin:0 auto 16px}.login h1{margin:0;text-align:center;font-size:30px}.login p{text-align:center;color:var(--muted);margin:8px 0 24px}.field{width:100%;border:1px solid #cfd4dc;border-radius:12px;padding:13px 14px;background:#fff;outline:none}.pin{font-size:24px;text-align:center;letter-spacing:8px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.btn.primary{background:#111827;color:#fff}.btn.blue{background:#2563eb;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.red{background:#dc2626;color:#fff}.btn.amber{background:#d97706;color:#fff}.btn.soft{background:#fff;color:#111827;border:1px solid #d0d5dd}.btn.full{width:100%}.login .btn{margin-top:14px}.err{min-height:20px;color:#b42318;text-align:center;font-size:13px;margin-top:10px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0f172a;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:900;padding:6px 10px 22px}.brand small{display:block;color:#94a3b8;font-size:11px;font-weight:600;margin-top:3px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;border-radius:10px;padding:11px 12px;font-weight:800}.nav button.on{background:#1e293b;color:#fff}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:4}.title{font-weight:900;font-size:21px;flex:1}.live{font-size:12px;color:var(--muted)}.content{padding:20px;max-width:1400px;margin:auto}.grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:16px}.metric{padding:16px}.metric small{color:var(--muted);font-weight:700}.metric b{display:block;font-size:30px;margin:3px 0}.metric span{font-size:12px;color:var(--muted)}.sectionHead{display:flex;gap:10px;align-items:center;margin:22px 0 10px}.sectionHead h2{font-size:18px;margin:0;flex:1}.card{padding:15px;margin-bottom:10px}.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.pill{font-size:11px;color:#fff;font-weight:900;padding:5px 9px;border-radius:999px}.muted{color:var(--muted);font-size:13px}.name{font-weight:900}.big{font-size:18px}.money{font-size:18px;font-weight:900}.sub{font-size:13px;color:#475467}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:30px}.alert{background:#fee4e2;color:#b42318;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;font-weight:800}.ok{color:#027a48}.warn{color:#b54708}.danger{color:#b42318}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters button{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#475467}.filters button.on{background:#111827;color:#fff;border-color:#111827}.driverMeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.driverMeta div{background:#f8fafc;border-radius:10px;padding:9px}.driverMeta small{display:block;color:#667085;font-size:11px}.driverMeta b{font-size:13px}.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #eef2f6;text-align:left;font-size:13px}.table th{color:#667085;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.amountPos{color:#027a48;font-weight:900}.amountNeg{color:#b42318;font-weight:900}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.48);display:grid;place-items:center;padding:20px;z-index:10}.modal{width:100%;max-width:460px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.modal h3{margin:0 0 12px}.modal .field{margin-bottom:10px}.modalActions{display:flex;gap:8px;margin-top:8px}.mobileNav{display:none}.spinner{height:3px;background:#e2e8f0;overflow:hidden;display:none}.spinner:after{content:"";display:block;height:100%;width:35%;background:#2563eb;animation:run 1s linear infinite}@keyframes run{from{transform:translateX(-110%)}to{transform:translateX(310%)}}@media(max-width:900px){.shell{display:block}.side{display:none}.metrics{grid-template-columns:1fr 1fr}.driverMeta{grid-template-columns:1fr 1fr}.two,.three{grid-template-columns:1fr}.content{padding:14px 14px 82px}.top{padding:0 14px}.mobileNav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:7;padding-bottom:env(safe-area-inset-bottom)}.mobileNav button{border:0;background:#fff;padding:10px 3px 9px;font-size:11px;font-weight:800;color:#667085}.mobileNav button.on{color:#111827}.mobileHide{display:none!important}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginCard"><div class="logo">UP</div><h1>UP Gestor</h1><p>Gestão completa do UP Entregas</p><input id="pin" class="field pin" maxlength="6" inputmode="numeric" type="password" placeholder="••••••"><button class="btn primary full" onclick="login()">ENTRAR</button><div id="err" class="err"></div></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">UP Gestor<small>Logística e entregadores</small></div><div id="nav" class="nav"></div></aside><section class="main"><header class="top"><div><div id="pageTitle" class="title">Visão geral</div><div id="live" class="live">Conectando…</div></div><div class="grow"></div><button class="btn soft" onclick="refresh(true)">Atualizar</button><button class="btn soft mobileHide" onclick="logout()">Sair</button></header><div id="spin" class="spinner"></div><main id="content" class="content"></main></section><nav id="mobileNav" class="mobileNav"></nav></div>
<div id="modal" class="modalBack hidden"><div class="modal"><h3 id="modalTitle">Ação</h3><div id="modalBody"></div><div class="modalActions"><button class="btn soft grow" onclick="closeModal()">Cancelar</button><button id="modalOk" class="btn primary grow">Confirmar</button></div></div></div>
<script>
const OPS='https://jgjmntezfjuyuxhcnvhd.supabase.co/functions/v1/gestor-orders';
const ADM='https://jgjmntezfjuyuxhcnvhd.supabase.co/functions/v1/up-manager-data';
const JWT='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnam1udGV6Zmp1eXV4aGNudmhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MzgyOTksImV4cCI6MjEwMzExNDI5OX0.n3yg9IdC6j8OB-vwi-yuXRKJZE3jdlL_wj3qVr-JBBc';
const tabs=[['dashboard','Visão geral'],['applications','Cadastros'],['couriers','Entregadores'],['rides','Corridas'],['finance','Financeiro'],['occurrences','Ocorrências']];
let PIN=sessionStorage.getItem('upgestor_pin')||'',TAB='dashboard',ORD=[],COU=[],APP=[],FIN={couriers:[],payouts:[]},busy=false,appFilter='all';
const $=s=>document.querySelector(s),terminal=s=>['ENTREGUE','CONCLUIDO','CONCLUÍDO','FINALIZADO','RETIRADO','CANCELADO','CANCELADA'].includes(String(s||'').toUpperCase());
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function ops(action,extra={}){const r=await fetch(OPS,{method:'POST',headers:{'content-type':'application/json','x-gestor-pin':PIN},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(r.status===401?'PIN incorreto.':j.error||j.message||'Falha na operação');return j}
async function admin(action,extra={}){const r=await fetch(ADM,{method:'POST',headers:{'content-type':'application/json','x-gestor-pin':PIN,'apikey':JWT,'authorization':'Bearer '+JWT},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(r.status===401?'PIN incorreto.':j.error||j.message||'Falha administrativa');return j}
async function login(){const p=$('#pin').value.trim();if(!/^\d{6}$/.test(p)){err('Digite o PIN de 6 dígitos.');return}PIN=p;try{await ops('ping');sessionStorage.setItem('upgestor_pin',PIN);start();await refresh(true)}catch(e){PIN='';err(e.message)}}
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');renderNav()}
function logout(){sessionStorage.removeItem('upgestor_pin');location.reload()}
function err(x){$('#err').textContent=x}
function renderNav(){const html=tabs.map(([id,label])=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')">${label}</button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=tabs.slice(0,5).map(([id,label])=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')">${label.replace('Visão geral','Início')}</button>`).join('')}
function go(t){TAB=t;renderNav();$('#pageTitle').textContent=(tabs.find(x=>x[0]===t)||[])[1]||'UP Gestor';render()}
async function refresh(show=false){if(busy||!PIN)return;busy=true;if(show)$('#spin').style.display='block';$('#live').textContent='Atualizando…';try{const [o,c,a,f]=await Promise.all([ops('list'),ops('couriers_list'),admin('applications_list'),admin('finance_summary')]);ORD=o.orders||[];COU=c.couriers||[];APP=a.applications||[];FIN=f||{couriers:[],payouts:[]};$('#live').textContent='Ao vivo • atualizado agora';render()}catch(e){$('#live').textContent='Falha de conexão';toast(e.message)}finally{busy=false;$('#spin').style.display='none'}}
function render(){const c=$('#content');if(TAB==='applications')c.innerHTML=applicationsView();else if(TAB==='couriers')c.innerHTML=couriersView();else if(TAB==='rides')c.innerHTML=ridesView();else if(TAB==='finance')c.innerHTML=financeView();else if(TAB==='occurrences')c.innerHTML=occurrencesView();else c.innerHTML=dashboardView()}
function metric(a,b,c){return `<div class="metric"><small>${esc(a)}</small><b>${esc(b)}</b><span>${esc(c)}</span></div>`}
function dashboardView(){const del=ORD.filter(o=>['ENTREGA','DELIVERY',''].includes(String(o.fulfillment_type||'').toUpperCase())),active=del.filter(o=>!terminal(o.status)),waiting=active.filter(o=>!o.courier_id),online=COU.filter(c=>c.online),pending=APP.filter(a=>a.status==='pending'||a.status==='correction'),balance=(FIN.couriers||[]).reduce((s,c)=>s+Number(c.balance||0),0),occ=del.filter(o=>(o.raw_payload||{}).up_occurrence_active);return `<div class="grid metrics">${metric('Corridas ativas',active.length,'agora')}${metric('Sem entregador',waiting.length,'aguardando')}${metric('Entregadores online',online.length,'disponíveis/ocupados')}${metric('Cadastros pendentes',pending.length,'para analisar')}</div><div class="sectionHead"><h2>Financeiro</h2><button class="btn soft" onclick="go('finance')">Abrir financeiro</button></div><div class="grid two">${metric('Saldo dos entregadores',brl(balance),'repasse líquido registrado')}${metric('Ocorrências abertas',occ.length,'atenção operacional')}</div><div class="sectionHead"><h2>Corridas em andamento</h2><button class="btn soft" onclick="go('rides')">Ver todas</button></div>${active.slice(0,6).map(orderCard).join('')||empty('Nenhuma corrida ativa.')}`}
function applicationsView(){const counts={pending:0,approved:0,correction:0,rejected:0,blocked:0};APP.forEach(a=>counts[a.status]=(counts[a.status]||0)+1);const filters=[['all','Todos',APP.length],['pending','Pendentes',counts.pending],['correction','Correção',counts.correction],['approved','Aprovados',counts.approved],['blocked','Bloqueados',counts.blocked]];const rows=APP.filter(a=>appFilter==='all'||a.status===appFilter);return `<div class="filters">${filters.map(([id,l,n])=>`<button class="${appFilter===id?'on':''}" onclick="setAppFilter('${id}')">${l} (${n})</button>`).join('')}</div>${rows.map(applicationCard).join('')||empty('Nenhum cadastro nesta situação.')}`}
function setAppFilter(x){appFilter=x;render()}
function applicationCard(a){const v=a.vehicle||{},p=a.pix||{},status={pending:['PENDENTE','#d97706'],approved:['APROVADO','#16a34a'],correction:['CORREÇÃO','#2563eb'],rejected:['REPROVADO','#dc2626'],blocked:['BLOQUEADO','#475467']}[a.status]||[a.status,'#475467'];return `<div class="card"><div class="row"><div class="grow"><div class="name big">${esc(a.full_name||'Entregador')}</div><div class="muted">${esc(a.email||'')} ${a.phone?'• '+esc(a.phone):''}</div></div><span class="pill" style="background:${status[1]}">${status[0]}</span></div><div class="driverMeta"><div><small>CPF</small><b>${esc(a.cpf||'—')}</b></div><div><small>Veículo</small><b>${esc(v.type||'—')} ${esc(v.model||'')}</b></div><div><small>Placa</small><b>${esc(v.plate||'—')}</b></div><div><small>Pix</small><b>${esc(p.type||'—')} ${esc(p.key||'')}</b></div></div>${a.rejection_reason?`<div class="alert">${esc(a.rejection_reason)}</div>`:''}<div class="actions"><button class="btn green" onclick="reviewApp('${a.id}','approved')">Aprovar</button><button class="btn blue" onclick="reviewApp('${a.id}','correction')">Pedir correção</button><button class="btn red" onclick="reviewApp('${a.id}','rejected')">Reprovar</button><button class="btn soft" onclick="reviewApp('${a.id}','blocked')">Bloquear</button></div></div>`}
async function reviewApp(id,status){let reason='';if(status!=='approved'){reason=prompt(status==='correction'?'O que precisa ser corrigido?':'Informe o motivo:')||'';if(!reason)return}try{await admin('application_set',{id,status,reason});toast('Cadastro atualizado.');await refresh(false)}catch(e){toast(e.message)}}
function couriersView(){const finMap=Object.fromEntries((FIN.couriers||[]).map(x=>[x.id,x]));return COU.map(c=>{const f=finMap[c.id]||{},lat=Number(c.current_lat||0),lng=Number(c.current_lng||0),meta=f.metadata||{};return `<div class="card"><div class="row"><div class="grow"><div class="name big">${esc(c.name||'Entregador')}</div><div class="muted">${esc(c.phone||'')}</div></div><span class="pill" style="background:${c.online?'#16a34a':'#667085'}">${c.online?'ONLINE':'OFFLINE'}</span></div><div class="driverMeta"><div><small>Status</small><b>${esc(driverStatus(c.status))}</b></div><div><small>Localização</small><b>${esc(c.last_location_at?relative(c.last_location_at):'Sem GPS')}</b></div><div><small>Saldo</small><b>${brl(f.balance||0)}</b></div><div><small>Veículo</small><b>${esc((meta.vehicle&&meta.vehicle.type)||meta.vehicle_type||'—')}</b></div></div><div class="actions">${valid(lat,lng)?`<button class="btn soft" onclick="openMap(${lat},${lng})">Abrir mapa</button>`:''}<button class="btn soft" onclick="openWallet('${c.id}')">Extrato</button><button class="btn blue" onclick="newPayout('${c.id}','${escAttr(c.name||'Entregador')}')">Pagamento</button></div></div>`}).join('')||empty('Nenhum entregador cadastrado.')}
function ridesView(){const list=ORD.filter(o=>['ENTREGA','DELIVERY',''].includes(String(o.fulfillment_type||'').toUpperCase())).sort((a,b)=>Number(terminal(a.status))-Number(terminal(b.status)));return list.map(orderCard).join('')||empty('Nenhuma corrida encontrada.')}
function orderCard(o){const c=o.customer||{},d=o.courier||{},raw=o.raw_payload||{},code=o.order_code||String(o.id||'').slice(0,6).toUpperCase(),lat=Number(d.current_lat||0),lng=Number(d.current_lng||0),assigned=!!o.courier_id;return `<div class="card"><div class="row"><div class="grow"><div class="name big">#${esc(code)} • ${esc(c.name||'Cliente')}</div><div class="muted">${esc(statusLabel(o.status))} ${o.payment_method?'• '+esc(o.payment_method):''}</div></div><div class="money">${brl(o.total)}</div></div><div class="sub" style="margin-top:8px">${assigned?'Entregador: '+esc(d.name||'Entregador'):'Aguardando entregador'}</div>${raw.up_occurrence_active?`<div class="alert">OCORRÊNCIA • ${esc(raw.up_occurrence_reason||'Informada pelo entregador')}</div>`:''}<div class="actions">${!assigned&&!terminal(o.status)?`<button class="btn primary" onclick="sendUp('${o.id}')">Enviar ao UP</button>`:''}${assigned&&valid(lat,lng)?`<button class="btn soft" onclick="openMap(${lat},${lng})">Mapa</button>`:''}</div></div>`}
async function sendUp(id){try{await ops('status',{orderId:id,status:'AGUARDANDO_ENTREGADOR'});toast('Pedido enviado ao UP.');await refresh(false)}catch(e){toast(e.message)}}
function financeView(){const rows=FIN.couriers||[],payouts=FIN.payouts||[],total=rows.reduce((s,c)=>s+Number(c.balance||0),0),pending=payouts.filter(p=>p.status==='pending').reduce((s,p)=>s+Number(p.amount||0),0),paid=payouts.filter(p=>p.status==='paid').reduce((s,p)=>s+Number(p.amount||0),0);return `<div class="grid three">${metric('Saldo total',brl(total),'a pagar/compensar')}${metric('Pagamentos pendentes',brl(pending),'registrados')}${metric('Pagamentos pagos',brl(paid),'histórico')}</div><div class="sectionHead"><h2>Entregadores</h2><button class="btn soft" onclick="syncFinance()">Sincronizar entregas</button></div>${rows.map(c=>`<div class="card"><div class="row"><div class="grow"><div class="name">${esc(c.name||'Entregador')}</div><div class="muted">${esc(c.phone||'')}</div></div><div><div class="money">${brl(c.balance||0)}</div><div class="muted">Pendente: ${brl(c.pending_payout||0)}</div></div></div><div class="actions"><button class="btn soft" onclick="openWallet('${c.id}')">Extrato</button><button class="btn blue" onclick="newPayout('${c.id}','${escAttr(c.name||'Entregador')}')">Novo pagamento</button><button class="btn soft" onclick="adjustWallet('${c.id}','${escAttr(c.name||'Entregador')}')">Ajuste</button></div></div>`).join('')||empty('Nenhum entregador no financeiro.')}<div class="sectionHead"><h2>Pagamentos recentes</h2></div>${payouts.slice(0,50).map(payoutCard).join('')||empty('Nenhum pagamento registrado.')}`}
async function syncFinance(){try{const r=await admin('finance_sync');toast(`Financeiro sincronizado${r.created!=null?' • '+r.created+' novos':''}.`);await refresh(false)}catch(e){toast(e.message)}}
function payoutCard(p){const c=(FIN.couriers||[]).find(x=>x.id===p.courier_id)||{};return `<div class="card"><div class="row"><div class="grow"><div class="name">${esc(c.name||'Entregador')}</div><div class="muted">${esc(p.method||'pix')} ${p.pix_key?'• '+esc(p.pix_key):''}</div></div><div class="money">${brl(p.amount)}</div><span class="pill" style="background:${p.status==='paid'?'#16a34a':p.status==='pending'?'#d97706':'#667085'}">${esc(p.status)}</span></div>${p.note?`<div class="sub" style="margin-top:8px">${esc(p.note)}</div>`:''}${p.status==='pending'?`<div class="actions"><button class="btn green" onclick="markPaid('${p.id}')">Marcar como pago</button></div>`:''}</div>`}
async function markPaid(id){if(!confirm('Confirmar que este repasse foi pago?'))return;try{await admin('payout_mark_paid',{id});toast('Pagamento marcado como pago.');await refresh(false)}catch(e){toast(e.message)}}
function newPayout(id,name){openModal('Novo pagamento — '+name,`<input id="mAmount" class="field" inputmode="decimal" placeholder="Valor, ex.: 25,00"><input id="mPix" class="field" placeholder="Chave Pix"><textarea id="mNote" class="field" rows="3" placeholder="Observação"></textarea>`,async()=>{const amount=Number($('#mAmount').value.replace(',','.'));if(!amount||amount<=0){toast('Informe um valor válido.');return}try{await admin('payout_create',{courier_id:id,amount,pix_key:$('#mPix').value,note:$('#mNote').value,method:'pix'});closeModal();toast('Pagamento registrado.');await refresh(false)}catch(e){toast(e.message)}})}
function adjustWallet(id,name){openModal('Ajuste — '+name,`<input id="mAmount" class="field" inputmode="decimal" placeholder="Valor positivo ou negativo"><textarea id="mNote" class="field" rows="3" placeholder="Motivo do ajuste"></textarea>`,async()=>{const amount=Number($('#mAmount').value.replace(',','.'));if(!amount){toast('Informe um valor diferente de zero.');return}try{await admin('wallet_adjust',{courier_id:id,amount,description:$('#mNote').value});closeModal();toast('Ajuste registrado.');await refresh(false)}catch(e){toast(e.message)}})}
async function openWallet(id){try{const r=await admin('wallet_list',{courier_id:id}),tx=r.transactions||[];openModal('Extrato do entregador',`<div class="tableWrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(dateTime(t.created_at))}</td><td>${esc(t.description||t.kind)}</td><td class="${Number(t.amount)>=0?'amountPos':'amountNeg'}">${brl(t.amount)}</td></tr>`).join('')||'<tr><td colspan="3">Sem lançamentos</td></tr>'}</tbody></table></div>`,()=>closeModal(),'Fechar')}catch(e){toast(e.message)}}
function occurrencesView(){const rows=ORD.filter(o=>(o.raw_payload||{}).up_occurrence_active);return rows.map(o=>{const r=o.raw_payload||{},c=o.customer||{},d=o.courier||{};return `<div class="card"><div class="row"><div class="grow"><div class="name">#${esc(o.order_code||String(o.id).slice(0,6))} • ${esc(c.name||'Cliente')}</div><div class="muted">${esc(d.name||'Sem entregador')}</div></div><span class="pill" style="background:#dc2626">OCORRÊNCIA</span></div><div class="alert">${esc(r.up_occurrence_reason||'Ocorrência informada')}</div></div>`}).join('')||empty('Nenhuma ocorrência aberta.')}
function openModal(title,body,onOk,okLabel='Confirmar'){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalOk').textContent=okLabel;$('#modalOk').onclick=onOk;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML=''}
function empty(x){return `<div class="card empty">${esc(x)}</div>`}
function toast(x){$('#live').textContent=x;setTimeout(()=>{if(PIN)$('#live').textContent='Ao vivo'},2800)}
function openMap(lat,lng){window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,'_blank')}
function valid(a,b){return a&&b&&Math.abs(a)<=90&&Math.abs(b)<=180}
function relative(x){const d=(Date.now()-new Date(x).getTime())/1000;if(!isFinite(d)||d<0)return x;if(d<60)return'agora';if(d<3600)return`há ${Math.floor(d/60)} min`;if(d<86400)return`há ${Math.floor(d/3600)} h`;return`há ${Math.floor(d/86400)} d`}
function dateTime(x){try{return new Date(x).toLocaleString('pt-BR')}catch{return x||''}}
function driverStatus(s){return({available:'Disponível',pickup:'Indo/na loja',delivery:'Em entrega',at_customer:'No cliente',offline:'Offline'})[String(s||'').toLowerCase()]||s||'Sem status'}
function statusLabel(s){s=String(s||'').toUpperCase();if(s.includes('AGUARDANDO_ENTREGADOR')||s.includes('BUSCANDO_ENTREGADOR'))return'Buscando entregador';if(s.includes('PREPAR'))return'Em preparo';if(s==='PRONTO')return'Pronto';if(s.includes('DESPACH')||s.includes('ENTREGA'))return'Em entrega';if(terminal(s))return s.startsWith('CANCEL')?'Cancelado':'Finalizado';return s.replaceAll('_',' ')||'Sem status'}
function escAttr(s){return String(s??'').replace(/["'<>]/g,'')}
if(PIN){start();refresh(true)}
</script>
</body>
</html>
